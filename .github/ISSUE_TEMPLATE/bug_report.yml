name: Bug Report
description: Report a bug or technical issue in GalaxyBookNabu
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
  - type: input
    id: environment
    attributes:
      label: OS / Build / Environment
    validations:
      required: true
